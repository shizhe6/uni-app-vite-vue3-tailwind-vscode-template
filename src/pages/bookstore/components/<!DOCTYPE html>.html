<!DOCTYPE html>
<html>
<head>
<style>
p.test1 { width:22em; border:1px solid #000000; text-wrap:wrap; }
p.test2 { width:11em; border:1px solid #000000; text-wrap:normal; }
</style>
</head>
<body>
<p class="test1">This paragraph contains some text. This line should not break or wrap to the next line.</p>
<p class="test2">This paragraph contains some text: The line breaks as normal.</p>
</body>
</html>
